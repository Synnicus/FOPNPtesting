name: Fallout PnP Android native regression

on:
  pull_request:
    paths:
      - "artifacts/fallout-pnp/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".github/workflows/fallout-pnp-android-native.yml"
  push:
    branches:
      - main
      - agent/ghoul-radiation-native
    paths:
      - "artifacts/fallout-pnp/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".github/workflows/fallout-pnp-android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fallout-pnp-android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  radiation-native-regressions:
    name: Ghoul and Hardcore radiation native regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android build platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate the Android project
        working-directory: artifacts/fallout-pnp
        env:
          CI: "1"
          EXPO_PUBLIC_DOMAIN: localhost
          EXPO_PUBLIC_REPL_ID: ci
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build an installable Android app
        working-directory: artifacts/fallout-pnp/android
        env:
          EXPO_PUBLIC_DOMAIN: localhost
          EXPO_PUBLIC_REPL_ID: ci
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Run native radiation regressions on Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            export APP_ID=com.pnpcalculator.app
            adb install artifacts/fallout-pnp/android/app/build/outputs/apk/release/app-release.apk
            adb shell pm clear "$APP_ID"
            export MAESTRO_VERSION=2.11.0
            curl -Ls "https://get.maestro.mobile.dev" | bash
            export PATH="$HOME/.maestro/bin:$PATH"
            maestro --version
            pnpm --filter @workspace/fallout-pnp run test:native:radiation
            pnpm --filter @workspace/fallout-pnp run test:native:ghoul-radiation-options
            pnpm --filter @workspace/fallout-pnp run test:native:ghoul-radiation-equipment-combat
            pnpm --filter @workspace/fallout-pnp run test:native:hardcore-radiation
            {
              echo "## Android native radiation regressions"
              echo
              echo "- Manual radiation character-editor flow: passed"
              echo "- Ghoul healing Options 1–4 with separate gains and exact HP/meter values: passed"
              echo "- Radiation meter cap, Super Mutant/Deathclaw immunity, and unchanged Half-Mutant resistance: passed"
              echo "- Worn body/helmet resistance and single-resistance combat aura: passed"
              echo "- Hardcore radiation persistence flow: passed"
              echo "- All flows ran against the installed release app on an Android emulator."
            } >> "$GITHUB_STEP_SUMMARY"
