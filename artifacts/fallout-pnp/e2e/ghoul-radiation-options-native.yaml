    text: "3 / 1000"
- assertVisible: "3 / 30"
- tapOn:
    id: character-save
- assertVisible: "${TEST_NAME} Option 3"
- stopApp
- launchApp

# Option 4: each absorbed rad heals immediately.
- tapOn: "Campaign"
- tapOn:
    id: campaign-options-button
- tapOn:
    id: campaign-gameplay-options-toggle
- scrollUntilVisible:
    element:
      id: ghoul-radiation-option-4
    direction: DOWN
- tapOn:
    id: ghoul-radiation-option-4
- tapOn: "Close campaign options"
- tapOn: "Characters"
- tapOn: "NEW CHARACTER"
- tapOn:
    id: character-name-input
- inputText: "${TEST_NAME} Option 4"
- hideKeyboard
- tapOn: "Ghoul"
- scrollUntilVisible:
    element:
      id: character-hp-decrease
    direction: DOWN
- repeat:
    times: 28
    commands:
      - tapOn:
          id: character-hp-decrease
- assertVisible: "2 / 30"
- scrollUntilVisible:
    element:
      id: character-radiation-amount
    direction: DOWN
- tapOn:
    id: character-radiation-amount
- inputText: "3"
- hideKeyboard
- tapOn:
    id: character-radiation-add
- assertVisible: "Apply Radiation Resistance?"
- tapOn: "APPLY RESISTANCE"
- assertVisible:
    id: character-radiation-meter
    text: "3 / 1000"
- assertVisible: "5 / 30"
- tapOn:
