# The optional rule also makes Super Mutants and Deathclaws immune, without
# changing a Half-Mutant's normal 20% resistance.
- tapOn: "NEW CHARACTER"
- tapOn:
    id: character-name-input
- inputText: "${TEST_NAME} Super Mutant"
- hideKeyboard
- scrollUntilVisible:
    element: "Super Mutant"
    direction: RIGHT
- tapOn: "Super Mutant"
- scrollUntilVisible:
    element:
      id: character-radiation-amount
    direction: DOWN
- tapOn:
    id: character-radiation-amount
- inputText: "100"
- hideKeyboard
- tapOn:
    id: character-radiation-add
- assertVisible: "Effective cumulative resistance is 100%."
- tapOn: "APPLY RESISTANCE"
- assertVisible:
    id: character-radiation-meter
    text: "0 / 1000"
- tapOn:
    id: character-save

- tapOn: "NEW CHARACTER"
- tapOn:
    id: character-name-input
- inputText: "${TEST_NAME} Deathclaw"
- hideKeyboard
- scrollUntilVisible:
    element: "Deathclaw"
    direction: RIGHT
- tapOn: "Deathclaw"
- scrollUntilVisible:
    element:
      id: character-radiation-amount
    direction: DOWN
- tapOn:
    id: character-radiation-amount
- inputText: "100"
- hideKeyboard
- tapOn:
    id: character-radiation-add
- assertVisible: "Effective cumulative resistance is 100%."
- tapOn: "APPLY RESISTANCE"
- assertVisible:
    id: character-radiation-meter
    text: "0 / 1000"
- assertVisible: "30 / 30"
- tapOn:
    id: character-save

- tapOn: "NEW CHARACTER"
- tapOn:
    id: character-name-input
- inputText: "${TEST_NAME} Half-Mutant"
- hideKeyboard
- scrollUntilVisible:
    element: "Half-Mutant"
    direction: RIGHT
- tapOn: "Half-Mutant"
- scrollUntilVisible:
    element:
      id: character-radiation-amount
    direction: DOWN
- tapOn:
    id: character-radiation-amount
- inputText: "100"
- hideKeyboard
- tapOn:
    id: character-radiation-add
- assertVisible: "Effective cumulative resistance is 20%."
- tapOn: "APPLY RESISTANCE"
- assertVisible:
    id: character-radiation-meter
    text: "80 / 1000"
- assertVisible: "30 / 30"
- tapOn:
    id: character-save

# The total radiation meter remains capped at exactly 1000.
- tapOn: "NEW CHARACTER"
- tapOn:
    id: character-name-input
- inputText: "${TEST_NAME} Meter Cap"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: character-radiation-amount
    direction: DOWN
- tapOn:
    id: character-radiation-amount
- inputText: "2000"
- hideKeyboard
- tapOn:
    id: character-radiation-add
- assertVisible: "Effective cumulative resistance is 0%."
- tapOn: "APPLY RESISTANCE"
- assertVisible:
    id: character-radiation-meter
    text: "1000 / 1000"
- assertVisible: "30 / 30"
- tapOn:
    id: character-save
